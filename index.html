<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🍓 BerryTask v0.7</title>
<style>
*{margin:0;box-sizing:border-box}
body{font-family:'Segoe UI','Hiragino Sans',sans-serif;background:#16141c;color:#e8e2ee;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#211d2b;border-bottom:1px solid #322c40}
header .logo{font-size:20px;font-weight:bold;color:#ff9eb5}
header .sub{font-size:11px;color:#776b85}
#tabs{display:flex;gap:4px;padding:10px 14px 0;background:#1b1824;flex-wrap:wrap;align-items:flex-end}
.tab{padding:8px 13px;border:none;border-radius:10px 10px 0 0;background:#242030;color:#998aa8;cursor:pointer;font-size:13px}
.tab.big{font-size:15px;padding:10px 18px;color:#ffb9c9;border:1px solid #453d55;border-bottom:none;font-weight:bold}
.tab.on{background:#2e2940;color:#fff}
.tab.big.on{border-color:#ff9eb5;color:#ff9eb5}
.pane{display:none;padding:16px;max-width:760px;margin:0 auto}
.pane.on{display:block}
.card{background:#211d2b;border:1px solid #322c40;border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:15px;color:#ff9eb5;margin-bottom:10px}
.btn{padding:9px 16px;border:none;border-radius:10px;background:#3a3348;color:#ddd;cursor:pointer;font-size:13px}
.btn:hover{background:#453d55}
.btn.pink{background:linear-gradient(135deg,#ff9eb5,#e0709a);color:#2b1520;font-weight:bold}
.btn.sm{padding:5px 10px;font-size:12px}
.start{border:none;border-radius:10px;background:linear-gradient(135deg,#8fc7ff,#5a9ae0);color:#0e1a2b;font-weight:bold;padding:10px 18px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.start:hover{filter:brightness(1.1)}
input,select,textarea{padding:9px 12px;border-radius:9px;border:1px solid #3a3348;background:#17141f;color:#eee;font-size:13px;outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:#ff9eb5}
#dayChips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.chip{padding:8px 13px;border-radius:12px;background:#242030;color:#998aa8;cursor:pointer;font-size:12.5px;white-space:nowrap;border:1px solid transparent;text-align:center;line-height:1.5}
.chip.on{background:#2e2940;color:#ff9eb5;border-color:#ff9eb5;font-weight:bold}
.chip small{display:block;font-size:10px;opacity:.7}
.task{display:flex;align-items:center;gap:9px;padding:11px 14px;border:1px solid #322c40;border-radius:12px;margin-bottom:8px;background:#1d1a26;flex-wrap:wrap}
.task.done{opacity:.45}
.task.done .tt{text-decoration:line-through}
.task.warn{border-color:#c9a542;background:#26221a}
.task.late{border-color:#c05656;background:#2a1c1e}
.task .time{font-size:11.5px;color:#8fc7ff;min-width:44px;font-family:Consolas,monospace}
.task .tt{flex:1;font-size:13.5px;line-height:1.5;min-width:150px}
.task .tt small{display:block;font-size:11px;color:#9b8dae}
.task .badge{font-size:10px;padding:2px 8px;border-radius:8px;background:#2e2940;color:#c9b3e8;white-space:nowrap}
.badge{font-size:10px;padding:2px 8px;border-radius:8px;background:#2e2940;color:#c9b3e8;white-space:nowrap}
.task .ok{border:none;background:#243a2c;color:#8fd8a0;border-radius:8px;padding:6px 11px;cursor:pointer;font-size:12.5px}
.task .rej{border:none;background:#3a2430;color:#ff9d9d;border-radius:8px;padding:6px 11px;cursor:pointer;font-size:12.5px}
.rule{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #322c40;border-radius:11px;margin-bottom:7px;font-size:13px;flex-wrap:wrap}
.rule .nm{flex:1;min-width:140px}
.rule .nm small{display:block;color:#776b85;font-size:11px}
.rule.off{opacity:.45}
.sw{width:38px;height:20px;border-radius:11px;background:#3a3348;position:relative;cursor:pointer;flex-shrink:0}
.sw::after{content:'';position:absolute;width:15px;height:15px;border-radius:50%;background:#998aa8;top:2.5px;left:3px;transition:.15s}
.sw.on{background:#e0709a}
.sw.on::after{left:20px;background:#fff}
.modal{position:fixed;inset:0;background:rgba(10,7,14,.8);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal.show{display:flex}
#formModal{z-index:70}
.mbox{background:#211d2b;border:1px solid #453d55;border-radius:16px;padding:20px;width:min(560px,95vw);max-height:88vh;overflow-y:auto}
.mbox h3{color:#ff9eb5;font-size:16px;margin-bottom:12px}
.mbox p{font-size:13px;color:#c9bfd6;line-height:1.8;margin-bottom:12px}
.hrow,.mrow{display:flex;gap:6px;margin-bottom:7px;flex-wrap:wrap}
.hrow input,.mrow input{flex:1;min-width:80px}
.form{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.form label{font-size:12px;color:#9b8dae;margin-top:4px}
.dayck{display:flex;gap:5px;flex-wrap:wrap}
.dayck span{padding:6px 11px;border-radius:9px;background:#242030;cursor:pointer;font-size:12.5px;border:1px solid transparent}
.dayck span.on{background:#2e2940;color:#ff9eb5;border-color:#ff9eb5}
.choice{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:9px;border:1px solid #322c40;border-radius:13px;background:#241f31;color:#e8e2ee;cursor:pointer;font-size:14px}
.choice:hover{border-color:#ff9eb5}
.choice small{display:block;color:#9b8dae;font-size:11.5px;margin-top:3px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2e2940;padding:10px 24px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:99;border:1px solid #453d55}
#toast.show{opacity:1}
.empty{text-align:center;color:#665a75;font-size:13px;padding:26px 0}
.hint{font-size:11.5px;color:#8d7a99;line-height:1.7;margin-top:8px}
.pstat{font-size:10px;padding:2px 8px;border-radius:8px;background:#243a2c;color:#8fd8a0}
/* note風マイプロ */
.note{position:relative;background:#efe4d1;border:1px solid #d9c7a6;border-radius:0;padding:16px;color:#3a3025;margin-bottom:18px}
.note input,.note textarea,.note select{background:#fffdf8;border:1px solid #d9c7a6;color:#3a3025;border-radius:0}
.note input::placeholder,.note textarea::placeholder{color:#b3a184}
.note input:focus,.note textarea:focus{border-color:#e0709a}
.bThumb{width:170px;height:170px;background:#e4d6bd;border:2px dashed #c6b18c;border-radius:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background-size:cover;background-position:center;color:#a08a68;font-size:12.5px;text-align:center;line-height:1.8}
.nThumb{width:90px;height:90px;background:#e4d6bd;border-radius:0;background-size:cover;background-position:center;flex-shrink:0}
.ntitle{display:inline-block;background:#191919;color:#fff;padding:7px 14px;font-weight:bold;font-size:16px;cursor:pointer;letter-spacing:.5px}
.nurl{color:#1a5dc8;font-size:12.5px;word-break:break-all}
.ndesc{font-size:13px;line-height:1.8;margin-top:6px;white-space:pre-wrap}
.ntabs{display:flex;margin:14px 0 0;border-bottom:2px solid #191919}
.ntabs button{border:none;background:transparent;padding:8px 16px;font-size:13px;cursor:pointer;color:#8a7355;border-radius:0}
.ntabs button.on{background:#191919;color:#fff;font-weight:bold}
.nin{width:100%;margin:10px 0 8px;padding:10px 12px}
.ncomp{margin:10px 0 8px}
.ncomp textarea{width:100%}
.nentry{background:#fffdf8;border:1px solid #e2d3b4;border-radius:0;padding:9px 12px;margin-bottom:7px;font-size:13px}
.nentry .nts{color:#a08a68;font-size:10.5px}
.nentry img{height:150px;object-fit:cover;border:1px solid #e2d3b4;display:block;margin:6px 0;max-width:100%}
.nbody{line-height:1.8;margin-top:3px}
.nfull{position:absolute;top:10px;right:10px;border:1px solid #c6b18c;background:#f8f1e3;color:#8a7355;border-radius:0;padding:5px 10px;cursor:pointer;font-size:13px;z-index:5}
.nfull:hover{background:#191919;color:#fff}
#fsWrap{position:fixed;inset:0;background:#16141c;z-index:80;display:none;flex-direction:column}
#fsWrap.show{display:flex}
#fsBar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#211d2b;border-bottom:1px solid #322c40}
#fsBody{flex:1;overflow-y:auto;padding:18px}
#fsBody .note{max-width:860px;margin:0 auto}
#fsBody .nentry img{height:220px}
/* カレンダー */
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.calDow{text-align:center;font-size:11px;color:#9b8dae;padding:4px 0}
.calCell{min-height:76px;background:#1d1a26;border:1px solid #2a2536;padding:3px 4px;cursor:pointer;overflow:hidden}
.calCell:hover{border-color:#453d55}
.calCell.today{border-color:#ff9eb5}
.calCell b{font-size:11px;color:#c9bfd6;display:block}
.cev{display:block;font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.6}
.cev.due{color:#ff6b6b}.cev.mile{color:#ffb84d}.cev.rdue{color:#ff9eb5}.cev.plan{color:#8fc7ff}.cev.soft{color:#776b85}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;margin-top:8px;color:#9b8dae}
#aiLog{display:none;background:#12101a;border:1px solid #322c40;padding:12px;font-size:13px;line-height:1.9;max-height:260px;overflow-y:auto;margin-top:10px;white-space:pre-wrap;border-radius:10px}
#aiLog.show{display:block}
</style>
</head>
<body>
<header><span class="logo">🍓 BerryTask</span><span class="sub">v0.7 — きみの秘書</span>
<button class="btn sm" style="margin-left:auto" onclick="openHarvest(true)">📬 Slack収穫</button></header>
<div id="tabs">
<button class="tab big on" data-p="homePane">🏠 ホーム</button>
<button class="tab big" data-p="newPane">➕ 新規</button>
<button class="tab" data-p="myproPane">📁 マイプロ</button>
<button class="tab" data-p="goalPane">🎯 月次目標</button>
<button class="tab" data-p="longPane">📅 長期</button>
<button class="tab" data-p="tanPane">📥 単発</button>
<button class="tab" data-p="allPane">📊 一覧</button>
<button class="tab big" data-p="setPane">⚙️ 既存</button>
</div>

<div class="pane on" id="homePane">
<div id="dayChips"></div>
<div class="card"><h2 id="dayTitle">今日のタスク</h2><div id="taskList"></div></div>
</div>

<div class="pane" id="newPane">
<div class="card"><h2>⚡ 単発をサッと追加</h2>
<div class="hrow"><input id="zTitle" placeholder="内容"><input id="zUrl" placeholder="URL(任意)"><input id="zDate" placeholder="7/23" style="max-width:100px"></div>
<button class="btn pink" onclick="addZatsu()">📥 追加</button>
<p class="hint">日付は「7/23」でOK(過去日なら来年扱い)。期限まで毎日表示/前日🟡/超過🔴</p></div>
<div class="card"><h2>🤖 AIおまかせ登録</h2>
<textarea id="aiIn" rows="4" style="width:100%" placeholder="雑に書いてOK!例:「日記アプリを来週までに作りたい」/コンテスト概要のコピペでも"></textarea>
<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
<button class="btn pink" onclick="aiSend()">🤖 AIに登録してもらう</button>
<button class="btn sm" onclick="aiReset()">🔄 会話リセット</button></div>
<div id="aiLog"></div>
<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center">
<input type="password" id="aiKey" placeholder="NVIDIA APIキー(nvapi-...)" style="flex:1;min-width:150px">
<input id="aiModel" placeholder="z-ai/glm-5.2" style="max-width:140px">
<button class="btn sm" onclick="aiSaveCfg()">💾</button></div>
<p class="hint">🔒 キーはこのブラウザにのみ保存。AIが聞き返してきたら答えを書いてもう一度送信!</p></div>
<div class="card"><h2>🗂 種類から登録</h2>
<button class="choice" onclick="openForm('test')">📝 テスト<small>クラス替え/ミニテスト/模試 — 教科ローテ自動割り振り</small></button>
<button class="choice" onclick="openForm('comp')">🏆 大会/研究<small>本番締切+副次締切+マイルストーン+週xコミット</small></button>
<button class="choice" onclick="openForm('play')">🎮 遊び/勉強会/イベント<small>日付と時間を選んで登録</small></button>
<button class="choice" onclick="openForm('meet')">🗣 面談<small>日付と時間を選んで登録</small></button>
<button class="choice" onclick="openGoalRegCurrent()">🎯 月次目標<small>[人間関係]と[実績]の目標を登録</small></button>
</div>
</div>

<div class="pane" id="myproPane">
<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;background:#211d2b;border:1px solid #322c40;border-radius:12px;padding:10px 14px">
<button class="btn pink" onclick="newProj()">➕ 新規プロジェクト</button>
<div class="dayck" id="pgFilter"></div></div>
<div id="pList"></div>
</div>

<div class="pane" id="goalPane"><div class="card"><h2>🎯 月次目標</h2><div id="goalList"></div>
<button class="btn pink" style="margin-top:8px" onclick="openGoalRegCurrent()">📝 登録/追加</button></div></div>

<div class="pane" id="longPane"><div class="card"><h2>📅 長期タスク一覧</h2><div id="longList"></div></div></div>

<div class="pane" id="tanPane"><div class="card"><h2>📥 単発タスク一覧</h2><div id="zList"></div>
<p class="hint">追加は➕新規タブから</p></div></div>

<div class="pane" id="allPane">
<div class="card"><h2>🗓 カレンダー
<span style="float:right"><button class="btn sm" onclick="calMove(-1)">←</button>
<b id="calTitle" style="font-size:14px;color:#ffd3a3;margin:0 8px"></b>
<button class="btn sm" onclick="calMove(1)">→</button></span></h2>
<div class="calGrid" id="calBody"></div>
<div class="legend"><span style="color:#ff6b6b">■締切/本番(遵守!)</span><span style="color:#ffb84d">■マイルストーン/目標</span><span style="color:#ff9eb5">■締切的ルーティン</span><span style="color:#8fc7ff">■時間のある予定</span><span style="color:#776b85">■ゆるルーティン</span></div></div>
<div class="card"><h2>📊 一覧</h2><div id="allBody"></div></div></div>

<div class="pane" id="setPane">
<div class="card"><h2>🔁 既存ルーティン(ON/OFF・編集)</h2><div id="ruleList"></div></div>
<div class="card"><h2>➕ 新規ルーティン</h2>
<div class="form">
<input id="nrName" placeholder="名前">
<select id="nrKind"><option value="weekly">毎週(曜日指定)</option><option value="monthlyNth">毎月第n曜日</option><option value="everyN">n日ごと</option></select>
<div id="nrParams"></div>
<input id="nrTime" placeholder="時間(例 19:00)"><input id="nrLink" placeholder="リンク(任意)">
<select id="nrCat"><option>勉強</option><option>実績</option><option>趣味</option><option>人間関係</option></select>
<button class="btn pink" onclick="addRule()">登録</button></div></div>
</div>

<div id="fsWrap"><div id="fsBar"><b style="color:#ff9eb5">⛶ 全画面表示</b>
<button class="btn sm" style="margin-left:auto" onclick="closeFs()">✕ 閉じる(Esc)</button></div>
<div id="fsBody"></div></div>

<div class="modal" id="harvestModal"><div class="mbox" id="harvestBox"></div></div>
<div class="modal" id="editModal"><div class="mbox" id="editBox"></div></div>
<div class="modal" id="formModal"><div class="mbox" id="formBox"></div></div>
<div id="toast"></div>

<script>
/* ===== 🍓 BerryTask v0.7 (クリーン統合版) ===== */
const LS={rules:'bt_rules',done:'bt_done',zatsu:'bt_zatsu',harvest:'bt_lastHarvest',cycle:'bt_reportCycle',slackWait:'bt_slackWait',long:'bt_long',goals:'bt_goals',mypro:'bt_mypro',aikey:'bt_aikey',aimodel:'bt_aimodel'};
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v===null||v===undefined?d:v}catch{return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const DOW=['日','月','火','水','木','金','土'];
const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>fmt(new Date());
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
function nthDow(y,m,nth,dow){const first=new Date(y,m,1);const off=(dow-first.getDay()+7)%7;return new Date(y,m,1+off+(nth-1)*7)}
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200)};
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
function qd(s){
  s=(s||'').trim();if(!s)return'';
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m)return fmt(new Date(+m[1],+m[2]-1,+m[3]));
  m=s.match(/^(\d{1,2})[\/\-月](\d{1,2})日?$/);
  if(m){const y=new Date().getFullYear();let d=new Date(y,+m[1]-1,+m[2]);
    if(fmt(d)<today())d=new Date(y+1,+m[1]-1,+m[2]);return fmt(d)}
  return'';
}
/* ---------- データ ---------- */
const SEED=[
{id:'report',name:'月次レポート(1.5h)',kind:'report',days:[3,6,0],time:'',link:'https://www.nnn.ed.nico/my_course',cat:'勉強',on:true},
{id:'hread',name:'Hリードテスト',kind:'hread',time:'',link:'',cat:'勉強',on:true,note:'リンクは編集からSlackチャンネルURLを'},
{id:'info_meet',name:'研究部情報定例会',kind:'monthlyNth',nth:2,dow:3,time:'19:00',link:'',cat:'実績',on:false,note:'現在ステルス中'},
{id:'ken_meet',name:'研究部定例会',kind:'monthlyNth',nth:4,dow:3,time:'19:00-21:00',link:'',cat:'実績',on:true},
{id:'miki',name:'研究部miki面談',kind:'monthlyNth',nth:3,dow:4,time:'11:00-11:50',link:'',cat:'実績',on:true},
{id:'stapla',name:'スタプラ面談',kind:'weekly',days:[4],time:'15:30',link:'https://mail.google.com/mail/u/0/#search/studyplus',cat:'勉強',on:true,derive:[{off:-1,label:'スタプラ記録'}]},
{id:'jk_chem',name:'塾:化学',kind:'juku',day:1,cat:'勉強',on:true},
{id:'jk_eng',name:'塾:英語',kind:'juku',day:2,cat:'勉強',on:true},
{id:'jk_phy',name:'塾:物理',kind:'juku',day:3,cat:'勉強',on:true},
{id:'jk_math',name:'塾:数学',kind:'juku',day:5,cat:'勉強',on:true},
{id:'jk_m3',name:'塾:数3',kind:'juku',day:6,cat:'勉強',on:true},
{id:'dinner',name:'夕飯代請求',kind:'weekly',days:[5],time:'',link:'',cat:'人間関係',on:true},
{id:'allow',name:'お小遣い請求',kind:'monthlyNth',nth:3,dow:0,time:'',link:'',cat:'人間関係',on:true},
{id:'sns',name:'LinkedIn/X 投稿',kind:'monthlyNth',nth:4,dow:0,time:'',link:'https://x.com',cat:'実績',on:true},
{id:'disco',name:'Discord返信',kind:'weekly',days:[0,1,2,3,4,5,6],time:'',link:'https://discord.com/channels/@me',cat:'人間関係',on:true},
{id:'line',name:'LINE返信',kind:'weekly',days:[0,1,2,3,4,5,6],time:'',link:'https://line.me',cat:'人間関係',on:true},
{id:'slowly',name:'Slowly返信',kind:'everyN',n:2,anchor:'2026-01-01',time:'',link:'https://web.slowly.app',cat:'人間関係',on:true,slowly:true},
{id:'gmail',name:'Gmail返信(2件)',kind:'everyN',n:2,anchor:'2026-01-02',time:'',link:'',cat:'人間関係',on:true,note:'リンクは編集からGmail検索URLを'}
];
let RULES=load(LS.rules,null);if(!RULES){RULES=SEED;save(LS.rules,RULES)}
let DONE=load(LS.done,{}),ZATSU=load(LS.zatsu,[]),CYCLE=load(LS.cycle,{}),LONG=load(LS.long,[]),GOALS=load(LS.goals,{}),MYPRO=load(LS.mypro,[]);
let selDate=today();
const mkeyOf=ds=>{const d=parse(ds);return d.getFullYear()+'-'+d.getMonth()};
const nextMK=k=>{let[y,m]=k.split('-').map(Number);m++;if(m>11){m=0;y++}return y+'-'+m};
const mkLabel=k=>{const[y,m]=k.split('-').map(Number);return`${y}年${m+1}月`};

/* ---------- エンジン ---------- */
function reportCycle(ds){const d=parse(ds);return d.getDate()<=15?`${d.getFullYear()}-${d.getMonth()}`:`${d.getFullYear()}-${d.getMonth()+1}`}
function hreadDays(y,m){const t1=nthDow(y,m,1,4);return{eng:addD(t1,2),mj:addD(t1,3),dead:addD(t1,7),end:addD(t1,8)}}
function mk(r,ds,title,o){return{key:`${r.id}|${ds}|${o.key||''}`,title,sub:o.sub||'',link:r.link,time:r.time||'',cat:r.cat,extra:o.extra,rid:r.id,ds}}
function tasksFor(ds){
  const d=parse(ds),y=d.getFullYear(),m=d.getMonth(),dow=d.getDay(),out=[];
  const hr=hreadDays(y,m);
  for(const r of RULES){
    if(!r.on)continue;
    if(r.kind==='report'){
      if(CYCLE[reportCycle(ds)])continue;
      if(ds===fmt(hr.eng)||ds===fmt(hr.mj))continue;
      if(r.days.includes(dow)){const cyM=+reportCycle(ds).split('-')[1];
        out.push(mk(r,ds,r.name,{sub:`締切: ${cyM+1}/15`,extra:'cycle'}))}
    }else if(r.kind==='hread'){
      if(ds===fmt(hr.eng))out.push(mk(r,ds,'Hリードテスト[英語]',{}));
      if(ds===fmt(hr.mj))out.push(mk(r,ds,'Hリードテスト[数学/国語]',{}));
      if(ds===fmt(hr.dead))out.push(mk(r,ds,'Hリード締切(余裕日)',{sub:`実期限: ${fmt(hr.end).slice(5)}`}));
    }else if(r.kind==='weekly'){
      if(r.days.includes(dow))out.push(mk(r,ds,r.slowly?`Slowly返信(${2+hash(ds)%3}人)`:r.name,{}));
      (r.derive||[]).forEach(dv=>{const tgt=addD(d,-dv.off);if(r.days.includes(tgt.getDay()))out.push(mk(r,ds,dv.label,{key:dv.label}))});
    }else if(r.kind==='monthlyNth'){
      if(ds===fmt(nthDow(y,m,r.nth,r.dow)))out.push(mk(r,ds,r.name,{}));
    }else if(r.kind==='everyN'){
      const diff=Math.round((d-parse(r.anchor))/864e5);
      if(diff>=0&&diff%r.n===0){let nm=r.name;if(r.slowly)nm=`Slowly返信(${2+hash(ds)%3}人)`;out.push(mk(r,ds,nm,{}))}
    }else if(r.kind==='juku'){
      const sub=r.name.replace('塾:','');
      if(dow===r.day)out.push(mk(r,ds,`${sub} 授業`,{}));
      if((r.day-dow+7)%7===3)out.push(mk(r,ds,`${sub} 復習(例題)`,{key:'rev1'}));
      if((r.day-dow+7)%7===2)out.push(mk(r,ds,`${sub} 宿題(問題集)`,{key:'hw'}));
      if((r.day-dow+7)%7===1)out.push(mk(r,ds,`${sub} 復習(見直し)`,{key:'rev2'}));
    }
  }
  for(const l of LONG){
    if(l.off)continue;
    (l.subs||[]).forEach(sd=>{if(sd.date===ds)out.push({key:`Ls${l.id}|${sd.date}|${sd.label}`,title:`📌 ${l.name}: ${sd.label}`,sub:'副次締切',time:'',cat:l.cat,link:l.link})});
    (l.miles||[]).forEach(ms=>{if(ms.date===ds)out.push({key:`Lm${l.id}|${ms.date}|${ms.label}`,title:`🚩 ${l.name}: ${ms.label}`,sub:'マイルストーン',time:'',cat:l.cat,link:l.link})});
    if(l.mainDate===ds)out.push({key:`LM${l.id}|${ds}`,title:`🏁 ${l.name} ${l.typ==='test'?'実施日':'本番'}`,sub:'',time:l.time||'',cat:l.cat,link:l.link});
    if(l.perWeek&&(l.pw||[]).length&&ds>=(l.start||today())&&l.end&&ds<l.end&&l.pw.includes(dow)){
      let idx=0;for(let dd=parse(l.start);fmt(dd)<ds;dd=addD(dd,1))if(l.pw.includes(dd.getDay()))idx++;
      const c=(l.contents||[]).length?l.contents[idx%l.contents.length]:'';
      const nx=[...(l.miles||[]).map(x=>({lb:'🚩'+x.label,dt:x.date})),{lb:l.typ==='test'?'🏁実施':'🏁本番',dt:l.mainDate}].filter(x=>x.dt&&x.dt>=ds).sort((a,b)=>a.dt<b.dt?-1:1);
      out.push({key:`Lc${l.id}|${ds}`,title:`${l.name}${c?': '+c:''}`,sub:nx.slice(0,2).map(x=>`${x.lb} ${x.dt.slice(5)}`).join(' / '),time:'',cat:l.cat,link:l.link});
    }
  }
  const gk=mkeyOf(ds),g=GOALS[gk];
  if(g)g.items.forEach(it=>{
    if(it.done)return;
    if(it.date===ds||(ds===today()&&it.date<today()))
      out.push({key:'g_'+it.id,goal:it.id,title:`🎯 ${it.text}`,sub:`月次目標[${it.cat}]`,time:'',cat:it.cat});
  });
  if(ds===today()){
    if(!GOALS[gk])out.push({key:'greg_'+gk,greg:gk,title:'📝 今月の月次目標を登録!',sub:'',time:'',cat:'実績'});
    else if(g.items.length&&g.items.every(x=>x.done)&&!GOALS[nextMK(gk)])
      out.push({key:'greg_'+nextMK(gk),greg:nextMK(gk),title:'📝 来月の月次目標を登録!',sub:'今月全達成🎉',time:'',cat:'実績'});
  }
  for(const z of ZATSU){
    if(z.done)continue;
    if(z.ev){if(z.date===ds)out.push({key:'z_'+z.id,title:z.title||z.url,sub:z.typ||'',link:z.url,time:z.time||'',cat:z.cat||'趣味',zid:z.id});continue}
    if((ds>=z.created&&ds<=z.date)||(ds===today()&&z.date<today())){
      let cls='';if(z.date<ds||(z.date<today()&&ds===today()))cls='late';else if(addD(parse(ds),1)>parse(z.date))cls='warn';
      out.push({key:'z_'+z.id,title:z.title||z.url,sub:`期限: ${z.date.slice(5)}`,link:z.url,time:'',cat:'単発',cls,zid:z.id});
    }
  }
  return out.sort((a,b)=>(a.time||'99')<(b.time||'99')?-1:1);
}
function pickDays(x){
  const loadMap=[0,0,0,0,0,0,0];
  for(let i=0;i<14;i++){const ds=fmt(addD(new Date(),i));loadMap[parse(ds).getDay()]+=tasksFor(ds).length}
  return[...Array(7).keys()].sort((a,b)=>loadMap[a]-loadMap[b]).slice(0,Math.min(x,7)).sort();
}

/* ---------- ホーム ---------- */
function renderChips(){
  const el=document.getElementById('dayChips');el.innerHTML='';
  for(let i=0;i<8;i++){const d=addD(new Date(),i),ds=fmt(d);
    const c=document.createElement('div');c.className='chip'+(ds===selDate?' on':'');
    c.innerHTML=`${i===0?'今日':i===1?'明日':DOW[d.getDay()]}<small>${d.getMonth()+1}/${d.getDate()}</small>`;
    c.onclick=()=>{selDate=ds;renderHome()};el.appendChild(c)}
}
function renderHome(){
  renderChips();
  const d=parse(selDate);
  document.getElementById('dayTitle').textContent=`${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})のタスク`;
  const list=document.getElementById('taskList');list.innerHTML='';
  const ts=tasksFor(selDate);
  if(!ts.length){list.innerHTML='<div class="empty">🎉 タスクなし!自由時間!</div>';return}
  ts.forEach(t=>{
    const done=DONE[t.key];
    const el=document.createElement('div');el.className='task'+(done?' done':'')+(t.cls?' '+t.cls:'');
    el.innerHTML=`<span class="time">${t.time||'--:--'}</span><span class="tt">${esc(t.title)}${t.sub?`<small>${esc(t.sub)}</small>`:''}</span><span class="badge">${t.cat}</span>`;
    if(t.link&&!done){const s=document.createElement('button');s.className='start';s.textContent='▶ START';
      s.onclick=()=>window.open(t.link,'_blank');el.appendChild(s)}
    if(t.greg){const b=document.createElement('button');b.className='start';b.textContent='📝 登録する';
      b.onclick=()=>openGoalReg(t.greg);el.appendChild(b);list.appendChild(el);return}
    if(t.goal){
      const ok=document.createElement('button');ok.className='ok';ok.textContent='✅ 達成';
      ok.onclick=()=>goalDone(t.goal);el.appendChild(ok);
      const rj=document.createElement('button');rj.className='rej';rj.textContent='❌ 今日は無理';
      rj.onclick=()=>goalReject(t.goal);el.appendChild(rj);
      list.appendChild(el);return}
    const b=document.createElement('button');b.className='ok';b.textContent=done?'↩':'✅';
    b.onclick=()=>{if(t.zid){const z=ZATSU.find(x=>x.id===t.zid);if(z){z.done=!z.done;save(LS.zatsu,ZATSU)}}else{DONE[t.key]=!done;save(LS.done,DONE)}renderAll()};
    el.appendChild(b);
    if(t.extra==='cycle'&&!done){const fin=document.createElement('button');fin.className='ok';fin.style.fontSize='11px';fin.textContent='🏁 今月分完了';
      fin.onclick=()=>{CYCLE[reportCycle(t.ds)]=true;save(LS.cycle,CYCLE);toast('🏁 今月のレポート完了!');renderHome()};el.appendChild(fin)}
    list.appendChild(el)});
}

/* ---------- 単発 ---------- */
function addZatsu(){
  const t=document.getElementById('zTitle').value.trim(),u=document.getElementById('zUrl').value.trim(),dt=qd(document.getElementById('zDate').value);
  if(!t&&!u)return toast('😵 内容かURLを');if(!dt)return toast('😵 日付が読めません(7/23形式)');
  ZATSU.push({id:Date.now()+''+Math.random(),title:t,url:u,date:dt,created:today(),done:false});
  save(LS.zatsu,ZATSU);document.getElementById('zTitle').value='';document.getElementById('zUrl').value='';document.getElementById('zDate').value='';
  toast(`📥 追加!(${dt.slice(5)}期限)`);renderAll();
}
function renderZatsu(){
  const el=document.getElementById('zList');el.innerHTML='';
  if(!ZATSU.length){el.innerHTML='<div class="empty">なし</div>';return}
  [...ZATSU].sort((a,b)=>a.date<b.date?-1:1).forEach(z=>{
    const d=document.createElement('div');d.className='task'+(z.done?' done':'')+(z.date<today()&&!z.done?' late':'');
    d.innerHTML=`<span class="time">${z.date.slice(5)}${z.time?' '+z.time:''}</span><span class="tt">${esc(z.title||z.url)}${z.typ?`<small>${esc(z.typ)}</small>`:''}</span>`;
    if(z.url){const s=document.createElement('button');s.className='start';s.style.padding='6px 12px';s.textContent='▶';s.onclick=()=>window.open(z.url,'_blank');d.appendChild(s)}
    const b=document.createElement('button');b.className='ok';b.textContent=z.done?'↩':'✅';
    b.onclick=()=>{z.done=!z.done;save(LS.zatsu,ZATSU);renderAll()};d.appendChild(b);
    const ed=document.createElement('button');ed.className='btn sm';ed.textContent='✏️';ed.onclick=()=>editZatsu(z.id);d.appendChild(ed);
    const del=document.createElement('button');del.className='rej';del.textContent='🗑';
    del.onclick=()=>{ZATSU=ZATSU.filter(x=>x.id!==z.id);save(LS.zatsu,ZATSU);renderAll()};d.appendChild(del);
    el.appendChild(d)});
}
function editZatsu(id){
  const z=ZATSU.find(x=>x.id===id);if(!z)return;
  const box=document.getElementById('formBox');
  box.innerHTML=`<h3>✏️ 単発を編集</h3><div class="form">
  <input id="ezT" placeholder="内容" value="${esc(z.title)}">
  <input id="ezU" placeholder="URL" value="${esc(z.url||'')}">
  <label>日付</label><input id="ezD" value="${z.date.slice(5).replace('-','/')}" placeholder="7/23">
  ${z.ev?`<label>時間</label><input id="ezTm" list="times" value="${esc(z.time||'')}">`:''}
  <div style="display:flex;gap:8px"><button class="btn pink" id="ezGo">💾 保存</button><button class="btn" onclick="closeForm()">閉じる</button></div></div>`;
  document.getElementById('ezGo').onclick=()=>{
    const dt=qd(document.getElementById('ezD').value);if(!dt)return toast('😵 日付が読めません');

function editLong(id){
  const l=LONG.find(x=>x.id===id);if(!l)return;
  const box=document.getElementById('formBox');
  box.innerHTML=`<h3>✏️ ${esc(l.name)}を編集</h3><div class="form">
  <input id="elN" value="${esc(l.name)}">
  <label>🏁 本番/実施日</label><input id="elM" value="${l.mainDate?l.mainDate.slice(5).replace('-','/'):''}" placeholder="7/23">
  <label>コミット開始日</label><input id="elS" value="${l.start?l.start.slice(5).replace('-','/'):''}" placeholder="7/23">
  <label>週何日コミット(変更時は曜日を負荷再計算)</label><input id="elP" type="number" value="${l.perWeek||0}" min="0" max="7">
  <label>内容ローテ(カンマ区切り)</label><input id="elC" value="${esc((l.contents||[]).join(','))}">
  <input id="elL" placeholder="URL" value="${esc(l.link||'')}">
  <div style="display:flex;gap:8px"><button class="btn pink" id="elGo">💾 保存</button><button class="btn" onclick="closeForm()">閉じる</button></div></div>`;
  document.getElementById('elGo').onclick=()=>{
    const m=qd(document.getElementById('elM').value);if(!m)return toast('😵 日付が読めません');
    l.name=document.getElementById('elN').value.trim()||l.name;l.mainDate=m;
    const s=qd(document.getElementById('elS').value);if(s)l.start=s;

    if(pw!==l.perWeek){l.perWeek=pw;l.pw=pw?pickDays(pw):[]}
    l.contents=document.getElementById('elC').value.split(',').map(x=>x.trim()).filter(Boolean);
    l.link=document.getElementById('elL').value.trim();
    l.end=[l.mainDate,...(l.miles||[]).map(x=>x.date)].filter(Boolean).sort().pop();
    save(LS.long,LONG);closeForm();toast('💾 保存!');renderAll()};
  document.getElementById('formModal').classList.add('show');
}

/* ---------- 月次目標 ---------- */
function goalDone(id){
  for(const k in GOALS){const it=GOALS[k].items.find(x=>x.id===id);
    if(it){it.done=true;save(LS.goals,GOALS);renderAll();
      if(GOALS[k].items.every(x=>x.done)&&!GOALS[nextMK(k)]){toast('🎉 全目標達成!来月分を登録しよう');openGoalReg(nextMK(k))}
      return}}
}
function goalReject(id){
  for(const k in GOALS){const it=GOALS[k].items.find(x=>x.id===id);
    if(it){const[y,m]=k.split('-').map(Number);const last=new Date(y,m+1,0).getDate();
      let min=mkeyOf(today())===k?parse(today()).getDate()+2:2;if(min>last)min=last;
      const day=min+Math.floor(Math.random()*(last-min+1));
      it.date=fmt(new Date(y,m,Math.min(day,last)));save(LS.goals,GOALS);
      toast(`↪ ${m+1}/${Math.min(day,last)}に再出現します`);renderAll();return}}
}
function openGoalRegCurrent(){const k=mkeyOf(today());openGoalReg(GOALS[k]&&GOALS[k].items.length&&GOALS[k].items.every(x=>x.done)?nextMK(k):k)}
function openGoalReg(k){
  const box=document.getElementById('formBox');
  const ex=GOALS[k]?GOALS[k].items.length:0;
  box.innerHTML=`<h3>🎯 ${mkLabel(k)}の月次目標${ex?'(追加)':''}</h3>
  <p>「〜を誘う」「マイプロ1個新規登録」など。1個ずついい感じの日に出現します。</p>
  <div id="gRows"><div class="mrow"><select class="gc"><option>実績</option><option>人間関係</option></select><input class="gt" placeholder="目標"></div></div>
  <button class="btn sm" onclick="gAddRow()">＋追加</button>
  <div style="display:flex;gap:8px;margin-top:12px">
  <button class="btn pink" id="gGo">✅ 登録</button>
  <button class="btn" onclick="closeForm()">やめる(後日また出ますw)</button></div>`;
  document.getElementById('gGo').onclick=()=>gSave(k);
  document.getElementById('formModal').classList.add('show');
}
function gAddRow(){document.getElementById('gRows').insertAdjacentHTML('beforeend','<div class="mrow"><select class="gc"><option>実績</option><option>人間関係</option></select><input class="gt" placeholder="目標"></div>')}
function gSave(k){
  const rows=[...document.querySelectorAll('#gRows .mrow')].map(r=>({cat:r.querySelector('.gc').value,text:r.querySelector('.gt').value.trim()})).filter(r=>r.text);
  if(!rows.length)return toast('😵 目標を書いてください');
  const[y,m]=k.split('-').map(Number);const last=new Date(y,m+1,0).getDate();
  if(!GOALS[k])GOALS[k]={items:[]};
  const base=mkeyOf(today())===k?Math.min(parse(today()).getDate()+1,last):2;
  rows.forEach((r,i)=>{const day=Math.min(base+i*2+hash(r.text)%2,last);
    GOALS[k].items.push({id:'g'+Date.now()+i,cat:r.cat,text:r.text,date:fmt(new Date(y,m,day)),done:false})});
  save(LS.goals,GOALS);closeForm();toast(`🎯 ${rows.length}個登録!`);renderAll();
}
function renderGoals(){
  const el=document.getElementById('goalList');el.innerHTML='';
  const ks=Object.keys(GOALS).sort((a,b)=>{const[ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number);return(by*12+bm)-(ay*12+am)}).slice(0,3);
  if(!ks.length){el.innerHTML='<div class="empty">まだ登録なし</div>';return}
  ks.forEach(k=>{
    el.insertAdjacentHTML('beforeend',`<div style="font-size:13px;color:#ffd3a3;margin:10px 0 6px">${mkLabel(k)}</div>`);
    GOALS[k].items.forEach(it=>{
      const d=document.createElement('div');d.className='task'+(it.done?' done':'');
      d.innerHTML=`<span class="time">${it.date.slice(5)}</span><span class="tt">${esc(it.text)}</span><span class="badge">${it.cat}</span><span>${it.done?'✅':'⏳'}</span>`;
      el.appendChild(d)})});
}

let idb=null;
const idbReady=new Promise(res=>{const rq=indexedDB.open('bt_img',1);

  rq.onsuccess=e=>{idb=e.target.result;res()};rq.onerror=()=>res()});

const imgGet=k=>new Promise(r=>{if(!idb)return r(null);const rq=idb.transaction('img').objectStore('img').get(k);rq.onsuccess=()=>r(rq.result||null);rq.onerror=()=>r(null)});

  const used=(String(it.text||'').match(/\{\{\d+\}\}/g)||[]).length;
  (it.imgs||[]).slice(used).forEach(imId=>{const img=document.createElement('img');imgGet(imId).then(b=>{if(b)img.src=URL.createObjectURL(b)});body.appendChild(img)});
  if(!it.text&&!(it.imgs||[]).length)body.innerHTML='<span style="color:#b3a184">(空)</span>';

async function attachImg(p,ta,file){

}

/* ---------- 🗓 カレンダー ---------- */
let calD=new Date();calD.setDate(1);
function calMove(n){calD.setMonth(calD.getMonth()+n);renderCal()}
function calFor(ds){
  const d=parse(ds),y=d.getFullYear(),m=d.getMonth(),dow=d.getDay(),out=[];
  const hr=hreadDays(y,m);
  if(d.getDate()===15&&RULES.some(r=>r.id==='report'&&r.on))out.push({t:'レポ締切',c:'rdue'});
  for(const r of RULES){
    if(!r.on)continue;
    if(r.kind==='hread'){
      if(ds===fmt(hr.eng))out.push({t:'Hリード英',c:'rdue'});
      if(ds===fmt(hr.mj))out.push({t:'Hリード数国',c:'rdue'});
      if(ds===fmt(hr.dead))out.push({t:'Hリード〆',c:'rdue'});
    }else if(r.kind==='weekly'&&r.days.length<7){
      if(r.days.includes(dow))out.push({t:r.name,c:r.time?'plan':'soft'});
    }else if(r.kind==='monthlyNth'){
      if(ds===fmt(nthDow(y,m,r.nth,r.dow)))out.push({t:r.name,c:r.time?'plan':'soft'});
    }else if(r.kind==='juku'){
      if(dow===r.day)out.push({t:r.name,c:'soft'});
    }
  }
  for(const l of LONG){
    if(l.off)continue;
    (l.subs||[]).forEach(s=>{if(s.date===ds)out.push({t:'📌'+s.label,c:'due'})});
    (l.miles||[]).forEach(ms=>{if(ms.date===ds)out.push({t:'🚩'+ms.label,c:'mile'})});
    if(l.mainDate===ds)out.push({t:'🏁'+l.name,c:'due'});
  }
  for(const z of ZATSU){if(z.done)continue;
    if(z.date===ds)out.push(z.ev?{t:(z.time?z.time+' ':'')+(z.title||'予定'),c:'plan'}:{t:(z.title||z.url),c:'due'})}
  const g=GOALS[mkeyOf(ds)];
  if(g)g.items.forEach(it=>{if(!it.done&&it.date===ds)out.push({t:'🎯'+it.text,c:'mile'})});
  const ord={due:0,mile:1,rdue:2,plan:3,soft:4};
  return out.sort((a,b)=>ord[a.c]-ord[b.c]);
}
function renderCal(){
  const el=document.getElementById('calBody');if(!el)return;
  const y=calD.getFullYear(),m=calD.getMonth();
  document.getElementById('calTitle').textContent=`${y}年${m+1}月`;
  const first=new Date(y,m,1),lastN=new Date(y,m+1,0).getDate();
  let html=DOW.map(d=>`<div class="calDow">${d}</div>`).join('');
  for(let i=0;i<first.getDay();i++)html+='<div></div>';
  for(let day=1;day<=lastN;day++){
    const ds=fmt(new Date(y,m,day)),evs=calFor(ds);
    html+=`<div class="calCell${ds===today()?' today':''}" data-ds="${ds}"><b>${day}</b>`;
    evs.slice(0,3).forEach(e=>html+=`<span class="cev ${e.c}">${esc(e.t)}</span>`);
    if(evs.length>3)html+=`<span class="cev soft">+${evs.length-3}件</span>`;
    html+='</div>';
  }
  el.innerHTML=html;
  el.querySelectorAll('.calCell').forEach(c=>c.onclick=()=>{
    selDate=c.dataset.ds;
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
    document.querySelector('.tab[data-p="homePane"]').classList.add('on');
    document.getElementById('homePane').classList.add('on');renderHome()});
}
